# cloud.yaml — GCP training configuration
# 8 blocks / 128 channels (~2.5M params)

rules:
  castling:          false
  pawn_double_step:  false
  promotion:         mantri_only
  check_rule:        none
  stalemate:         side_to_move_wins
  repetition_draw:   false
  fifty_move_rule:   false
  bare_king:         loss

net:
  blocks: 8
  channels: 128
  action_space: 4096
  input_planes: 14

mcts:
  sims: 100
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_eps: 0.25
  virtual_loss: 3         # used when leaves_per_step > 1
  reuse_subtree: true
  leaves_per_step: 1      # leaves per game per network batch; raise (2-8) after benchmarking
  eval_cache_size: 50000  # transposition/evaluation cache entries per worker; 0 = off

play:
  temp_moves: 20
  move_cap: 300
  adjudicate_margin: 4.0

train:
  optimizer: adamw              # decoupled weight decay (needtofix L3); "adam" = plan's explicit L2 loss
  lr: 2.0e-3
  lr_milestones: [80, 200]
  lr_gamma: 0.1
  batch_size: 512
  l2: 1.0e-4                # c in the explicit L2 term, used only with optimizer: adam
  weight_decay: 1.0e-2     # AdamW decay; tune (typical 1e-2 to 1e-1)
  buffer_size: 1000000
  steps_per_iter: 2000        # upper bound; actual = ceil(replay_ratio x new positions / batch)
  replay_ratio: 3.0           # samples drawn per new position (needtofixagain N5)
  min_buffer: 50000           # no training until the buffer holds this many positions
  grad_clip: 1.0
  amp_inference: true
  mirror_augment: true

arena:
  games: 200               # SE of the score ~3.5 points at 200 games (~6.4 at 60); needtofixagain N12
  sims: 100                # same search budget as self-play (it was a hidden sims // 2, N11)
  win_threshold: 0.55
  every_n_iters: 5
  opening_plies: 4        # random shared opening per game pair, so argmax players don't replay 2 games

loop:
  games_per_iter: 1000
  iterations: 300
  parallel_games: 128
  workers: 12               # self-play processes (1 = in-process)

cloud:
  machine: n1-standard-16
  gpu: nvidia-tesla-t4
  spot: true
  bucket: gs://chaturangazero
  checkpoint_every: 1
  buffer_snapshot_every: 1        # compact buffer: cheap enough every iteration (needtofix M8)

device: auto        # auto | cpu | cuda | cuda:N  (CLI --device or CHATURANGA_DEVICE override)
seed: 20260829
