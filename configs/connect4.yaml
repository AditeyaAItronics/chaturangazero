# connect4.yaml — Phase 0 pipeline proof
# Connect-4: 6 rows x 7 columns

game: connect4

net:
  blocks: 3
  channels: 64
  action_space: 7
  input_planes: 3     # our pieces, their pieces, all-ones

mcts:
  sims: 25
  c_puct: 1.5
  dirichlet_alpha: 1.0
  dirichlet_eps: 0.25
  virtual_loss: 3         # used when leaves_per_step > 1
  reuse_subtree: true
  leaves_per_step: 1      # leaves per game per network batch; raise (2-8) after benchmarking
  eval_cache_size: 50000  # transposition/evaluation cache entries per worker; 0 = off

play:
  temp_moves: 10
  move_cap: 42        # 6*7 = 42 max moves

train:
  optimizer: adamw              # decoupled weight decay (needtofix L3); "adam" = plan's explicit L2 loss
  lr: 2.0e-3
  lr_milestones: [30, 60]       # 60 is past the 50 iterations, so only the first decay happens;
                                # kept as-is because this is the proven Phase-0 setting
  lr_gamma: 0.1
  batch_size: 256
  l2: 1.0e-4                # c in the explicit L2 term, used only with optimizer: adam
  weight_decay: 1.0e-2     # AdamW decay; tune (typical 1e-2 to 1e-1)
  buffer_size: 100000
  steps_per_iter: 500
  grad_clip: 1.0
  amp_inference: true
  mirror_augment: true  # Connect-4 is left-right symmetric

arena:
  games: 40
  win_threshold: 0.55
  every_n_iters: 3
  opening_plies: 4        # random shared opening per game pair, so argmax players don't replay 2 games

loop:
  games_per_iter: 100
  iterations: 50
  parallel_games: 16
  workers: 4               # self-play processes (1 = in-process)

device: auto        # auto | cpu | cuda | cuda:N  (CLI --device or CHATURANGA_DEVICE override)
seed: 20260829
