# local.yaml — 3060 development configuration
# 5 blocks / 64 channels (~500k params)

game: chaturanga

rules:
  castling:          false
  pawn_double_step:  false
  promotion:         mantri_only
  check_rule:        none
  stalemate:         side_to_move_wins
  repetition_draw:   false
  fifty_move_rule:   false
  bare_king:         loss

net:
  blocks: 5
  channels: 64
  action_space: 4096
  input_planes: 14

mcts:
  sims: 40
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_eps: 0.25
  virtual_loss: 3         # used when leaves_per_step > 1
  reuse_subtree: true
  leaves_per_step: 1      # leaves per game per network batch; raise (2-8) after benchmarking
  eval_cache_size: 50000  # transposition/evaluation cache entries per worker; 0 = off
  fpu_reduction: null     # unvisited-move value: null = 0 (draw); e.g. 0.25 = parent Q - 0.25*sqrt(visited prior) (N18; A/B before enabling)

play:
  temp_moves: 20
  move_cap: 300
  adjudicate_margin: 4.0

train:
  optimizer: adamw              # decoupled weight decay (needtofix L3); "adam" = plan's explicit L2 loss
  lr: 2.0e-3
  lr_milestones: [80, 160]      # training iterations; both inside the 200-iteration run (N17)
  lr_gamma: 0.1
  batch_size: 256
  l2: 1.0e-4                # c in the explicit L2 term, used only with optimizer: adam
  weight_decay: 1.0e-2     # AdamW decay; tune (typical 1e-2 to 1e-1)
  buffer_size: 500000
  steps_per_iter: 1000        # upper bound; actual = ceil(replay_ratio x new positions / batch)
  replay_ratio: 3.0           # samples drawn per new position (needtofixagain N5)
  min_buffer: 10000           # no training until the buffer holds this many positions
  grad_clip: 1.0
  amp_inference: true
  mirror_augment: true

arena:
  games: 100               # SE of the score ~5 points at 100 games (~6.4 at 60); needtofixagain N12
  sims: 40                # same search budget as self-play (it was a hidden sims // 2, N11)
  win_threshold: 0.55
  every_n_iters: 5
  opening_plies: 4        # random shared opening per game pair, so argmax players don't replay 2 games

loop:
  games_per_iter: 200
  iterations: 200             # plan Tier B (local 3060): 200 iterations at 40 sims
  parallel_games: 32
  workers: 4               # self-play processes (1 = in-process)

device: auto        # auto | cpu | cuda | cuda:N  (CLI --device or CHATURANGA_DEVICE override)
seed: 20260829
