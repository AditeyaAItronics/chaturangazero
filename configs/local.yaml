# local.yaml — 3060 development configuration
# 5 blocks / 64 channels (~500k params)

game: chaturanga

rules:
  castling:          false
  pawn_double_step:  false
  promotion:         mantri_only
  check_rule:        none
  stalemate:         side_to_move_wins
  repetition_draw:   false
  fifty_move_rule:   false
  bare_king:         loss

net:
  blocks: 5
  channels: 64
  action_space: 4096
  input_planes: 14

mcts:
  sims: 40
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_eps: 0.25
  virtual_loss: 3
  reuse_subtree: true

play:
  temp_moves: 20
  move_cap: 300
  adjudicate_margin: 4.0

train:
  optimizer: adam
  lr: 2.0e-3
  lr_milestones: [80, 200]
  lr_gamma: 0.1
  batch_size: 256
  l2: 1.0e-4
  buffer_size: 500000
  steps_per_iter: 1000
  grad_clip: 1.0
  amp_inference: true
  mirror_augment: true

arena:
  games: 40
  win_threshold: 0.55
  every_n_iters: 5

loop:
  games_per_iter: 200
  iterations: 100
  parallel_games: 32
  workers: 4

seed: 20260829
